<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Consent Frame Repro — Child Frame</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fffaf3; padding: 12px; color: #1a2332; }
    h1 { font-size: 14px; margin-bottom: 2px; }
    .sub { font-size: 11px; color: #8993a4; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; font-size: 11px; padding: 5px 0; border-bottom: 1px solid #f0e6d8; }
    .row .k { color: #8993a4; width: 108px; flex-shrink: 0; }
    .row .v { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
    .v.dnt { color: #de350b; font-weight: 700; }
    .v.ok { color: #216e4e; font-weight: 700; }
    h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #8993a4; margin: 12px 0 5px; }
    #logs { list-style: none; font-family: ui-monospace, Menlo, monospace; font-size: 10px; max-height: 130px; overflow-y: auto; background: #1a2332; border-radius: 4px; padding: 7px; }
    #logs li { color: #c5cee0; padding: 1px 0; word-break: break-word; }
    #logs li.warn { color: #fbbf24; }
    #logs li.error { color: #f87171; }
    #logs li.hit { color: #f87171; font-weight: 700; }
    .empty { color: #5e6c84; font-style: italic; }
</style>
<script>
// Runs before the parent's autoFrameInstall injects the SDK, so the rejection warning
// ("Ignoring visitor id … while identity consent is dnt") is captured rather than lost.
window.__reproLogs = [];
['log', 'warn', 'error'].forEach(function (method) {
    var original = console[method].bind(console);
    console[method] = function () {
        try {
            window.__reproLogs.push({
                level: method,
                msg: Array.prototype.slice.call(arguments).map(String).join(' ')
            });
            if (window.__reproLogs.length > 200) window.__reproLogs.shift();
        } catch (e) { /* never let logging break the frame */ }
        original.apply(console, arguments);
    };
});
</script>
</head>
<body>

<h1 id="title">Child frame</h1>
<div class="sub">Installed by <code>autoFrameInstall</code> from the top frame.</div>

<div class="row"><span class="k">Web SDK</span><span class="v" id="installed">not installed yet</span></div>
<div class="row"><span class="k">Granted tiers</span><span class="v" id="tiers">&mdash;</span></div>
<div class="row"><span class="k">Configured</span><span class="v" id="collection">&mdash;</span></div>
<div class="row"><span class="k">Visitor ID</span><span class="v" id="visitor">&mdash;</span></div>
<div class="row"><span class="k">Account ID</span><span class="v" id="account">&mdash;</span></div>

<h2>Console output in this frame</h2>
<ul id="logs"><li class="empty">nothing yet&hellip;</li></ul>

<script>
var COOKIELESS = '__cookieless_visitor__';

(function () {
    var label = decodeURIComponent((location.search.match(/[?&]label=([^&]*)/) || [])[1] || '');
    if (label) document.getElementById('title').textContent = label;
})();

function sdk() {
    return (window.pendo && typeof window.pendo.getConfigValue === 'function') ? window.pendo : null;
}

function set(id, value, cls) {
    var el = document.getElementById(id);
    el.textContent = (value === undefined || value === null || value === '') ? '\u2014' : value;
    el.className = 'v' + (cls ? ' ' + cls : '');
}

function render() {
    var p = sdk();

    if (!p) {
        document.getElementById('installed').textContent = window.pendo ? 'bootstrapping…' : 'not installed yet';
        return;
    }

    set('installed', 'installed', 'ok');

    var tiers = p.getConfigValue('cookieConsentTiers');
    var collection = p.getConfigValue('cookieConsentCollection') || {};
    var vid = p.getVisitorId();

    set('tiers', [].concat(tiers || []).join(', ') || '(none)');
    set('collection', Object.keys(collection).sort().join(', ') || '(none)');
    set('visitor', vid, vid === COOKIELESS ? 'dnt' : 'ok');
    set('account', p.getAccountId() || '(none)');

    var list = document.getElementById('logs');
    list.innerHTML = '';
    if (!window.__reproLogs.length) {
        list.innerHTML = '<li class="empty">nothing yet…</li>';
        return;
    }
    window.__reproLogs.forEach(function (entry) {
        var li = document.createElement('li');
        var isHit = entry.msg.indexOf('identity consent is dnt') !== -1;
        li.className = isHit ? 'hit' : entry.level;
        li.textContent = (isHit ? '>> ' : '') + entry.msg;
        list.appendChild(li);
    });
    list.scrollTop = list.scrollHeight;
}

setInterval(render, 500);
render();
</script>
</body>
</html>
