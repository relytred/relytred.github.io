<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #10131a;
            color: #e8ecf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 440px;
            padding: 32px;
        }

        .icon {
            font-size: 52px;
        }

        h1 {
            margin: 16px 0 8px;
            font-size: 30px;
        }

        p {
            margin: 0 0 24px;
            color: #98a3b8;
            line-height: 1.6;
        }

        a {
            color: #6ea8fe;
        }
    </style>
    <script>
        const STORAGE_KEY = 'pendo_session';

        (function(apiKey){
            (function(p,e,n,d,o){var v,w,x,y,z;o=p[d]=p[d]||{};o._q=o._q||[];
            v=['initialize','identify','updateOptions','pageLoad','track'];for(w=0,x=v.length;w<x;++w)(function(m){
                o[m]=o[m]||function(){o._q[m===v[0]?'unshift':'push']([m].concat([].slice.call(arguments,0)));};})(v[w]);
                y=e.createElement(n);y.async=!0;y.src='https://cdn.pendo-atlas.pendo-dev.com/agent/static/'+apiKey+'/pendo.js';
                z=e.getElementsByTagName(n)[0];z.parentNode.insertBefore(y,z);})(window,document,'script','pendo');
        })('d637f6b0-d114-4c64-b299-4a777053ab9e');

        // Reuses whatever session vds.html stored, so the pages identify as the same visitor.
        (function initPendo() {
            let session = null;
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw && JSON.parse(raw);
                if (parsed && Date.now() < parsed.expiresAt) session = parsed;
            } catch {}

            pendo.initialize({
                visitor: { id: session ? session.visitorId : 'cubo-anon' },
                account: { id: (session && session.accountId) || 'no-account' }
            });
        })();
    </script>
</head>
<body>
    <main>
        <div class="icon">🧊</div>
        <h1>Cubo</h1>
        <p>This sub app hasn't been built yet. The page is here so the Pendo agent has somewhere to report from while the rest of the suite comes together.</p>
        <a href="/">Back to all apps</a>
    </main>
</body>
</html>
