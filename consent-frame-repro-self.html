<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Consent Frame Repro — Self-Installing Frame</title>
<script src="./consent-frame-repro-beacons.js"></script>
<script>
// Opt out of the parent's autoFrameInstall before it can reach this frame, so the SDK here
// comes from the snippet below rather than being seeded with the parent's local config.
window.ignoreIframeMonitor = true;

// Runs before the snippet, so the rejection warning ("Ignoring visitor id … while identity
// consent is dnt") is captured rather than lost.
window.__reproLogs = [];
['log', 'warn', 'error'].forEach(function (method) {
    var original = console[method].bind(console);
    console[method] = function () {
        try {
            window.__reproLogs.push({
                level: method,
                msg: Array.prototype.slice.call(arguments).map(String).join(' ')
            });
            if (window.__reproLogs.length > 200) window.__reproLogs.shift();
        } catch (e) { /* never let logging break the frame */ }
        original.apply(console, arguments);
    };
});
</script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f6ff; padding: 12px; color: #1a2332; }
    h1 { font-size: 14px; margin-bottom: 2px; }
    .sub { font-size: 11px; color: #8993a4; margin-bottom: 10px; }
    .row { display: flex; gap: 8px; font-size: 11px; padding: 5px 0; border-bottom: 1px solid #e2e8f8; }
    .row .k { color: #8993a4; width: 108px; flex-shrink: 0; }
    .row .v { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
    .v.dnt { color: #de350b; font-weight: 700; }
    .v.ok { color: #216e4e; font-weight: 700; }
    h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #8993a4; margin: 12px 0 5px; }
    #logs { list-style: none; font-family: ui-monospace, Menlo, monospace; font-size: 10px; max-height: 130px; overflow-y: auto; background: #1a2332; border-radius: 4px; padding: 7px; }
    #logs li { color: #c5cee0; padding: 1px 0; word-break: break-word; }
    #logs li.warn { color: #fbbf24; }
    #logs li.error { color: #f87171; }
    #logs li.hit { color: #f87171; font-weight: 700; }
    .empty { color: #5e6c84; font-style: italic; }
</style>
</head>
<body>

<h1 id="title">Self-installing frame</h1>
<div class="sub">Loads its own Pendo snippet. <code>autoFrameInstall</code> never touches it.</div>

<div class="row"><span class="k">Web SDK</span><span class="v" id="installed">not installed yet</span></div>
<div class="row"><span class="k">Granted tiers</span><span class="v" id="tiers">&mdash;</span></div>
<div class="row"><span class="k">Configured</span><span class="v" id="collection">&mdash;</span></div>
<div class="row"><span class="k">Visitor ID</span><span class="v" id="visitor">&mdash;</span></div>
<div class="row"><span class="k">Account ID</span><span class="v" id="account">&mdash;</span></div>

<h2>Console output in this frame</h2>
<ul id="logs"><li class="empty">nothing yet&hellip;</li></ul>

<script>
var COOKIELESS = '__cookieless_visitor__';

// Same localStorage key the top frame writes, so both agree on api key and agent build.
var current = (function () {
    var defaults = {
        apiKey: '197e6666-28c5-4090-75a1-f451638c2bc7',
        agent: 'https://cdn.pendo-atlas.pendo-dev.com/agent/static/{apiKey}/pendo.js'
    };
    try {
        var saved = JSON.parse(localStorage.getItem('consent-frame-repro-config') || '{}');
        return {
            apiKey: saved.apiKey || defaults.apiKey,
            agent: saved.agent || defaults.agent
        };
    } catch (e) { return defaults; }
})();

var AGENT_URL = current.agent.replace('{apiKey}', current.apiKey);

(function () {
    var label = decodeURIComponent((location.search.match(/[?&]label=([^&]*)/) || [])[1] || '');
    if (label) document.getElementById('title').textContent = label;
})();
</script>

<!-- This frame's own Pendo snippet -->
<script>
(function (agentUrl) {
    (function(p,e,n,d,o){var v,w,x,y,z;o=p[d]=p[d]||{};o._q=o._q||[];
    v=['initialize','identify','updateOptions','pageLoad','track'];for(w=0,x=v.length;w<x;++w)(function(m){
        o[m]=o[m]||function(){o._q[m===v[0]?'unshift':'push']([m].concat([].slice.call(arguments,0)));};})(v[w]);
        y=e.createElement(n);y.async=!0;y.src=agentUrl;
        z=e.getElementsByTagName(n)[0];z.parentNode.insertBefore(y,z);})(window,document,'script','pendo');
})(AGENT_URL);

pendo.initialize({
    apiKey: current.apiKey,

    // Deliberately no visitor/account. The only route to an identity here is the top frame
    // pushing one down, which is what makes the rejection visible.
    frameIdentitySync: true,
    frameIdentityTopDownOnly: true,
    selfHostedWebSDKUrl: AGENT_URL,

    // This page hardcodes the denying tier, the way a real embedded app's own snippet would.
    // Nothing tells it a consent change already happened in the top frame.
    cookieConsentTiers: ['strictlyNecessary'],
    cookieConsentCollection: {
        strictlyNecessary: {
            visitorIdentity: { trackVisitors: false },
            analytics: { enabled: false },
            guides: { enabled: true },
            sessionReplay: { enabled: false }
        },
        functional: {
            visitorIdentity: { trackVisitors: true },
            analytics: {
                enabled: true,
                eventCollection: {
                    pageLoads: true, clicks: true, identify: true, meta: true,
                    trackEvents: true, focus: true, formSubmits: true, fieldChanges: true,
                    guideServing: true, utmParameters: true, textCollectionMode: 'all'
                }
            },
            guides: { enabled: true },
            sessionReplay: { enabled: true }
        }
    }
});
</script>

<script>
function sdk() {
    return (window.pendo && typeof window.pendo.getConfigValue === 'function') ? window.pendo : null;
}

function set(id, value, cls) {
    var el = document.getElementById(id);
    el.textContent = (value === undefined || value === null || value === '') ? '\u2014' : value;
    el.className = 'v' + (cls ? ' ' + cls : '');
}

function render() {
    var p = sdk();

    if (!p) {
        document.getElementById('installed').textContent = window.pendo ? 'bootstrapping…' : 'not installed yet';
        return;
    }

    set('installed', 'installed (own snippet)', 'ok');

    var tiers = p.getConfigValue('cookieConsentTiers');
    var collection = p.getConfigValue('cookieConsentCollection') || {};
    var vid = p.getVisitorId();

    set('tiers', [].concat(tiers || []).join(', ') || '(none)');
    set('collection', Object.keys(collection).sort().join(', ') || '(none)');
    set('visitor', vid, vid === COOKIELESS ? 'dnt' : 'ok');
    set('account', p.getAccountId() || '(none)');

    var list = document.getElementById('logs');
    list.innerHTML = '';
    if (!window.__reproLogs.length) {
        list.innerHTML = '<li class="empty">nothing yet…</li>';
        return;
    }
    window.__reproLogs.forEach(function (entry) {
        var li = document.createElement('li');
        var isHit = entry.msg.indexOf('identity consent is dnt') !== -1;
        li.className = isHit ? 'hit' : entry.level;
        li.textContent = (isHit ? '>> ' : '') + entry.msg;
        list.appendChild(li);
    });
    list.scrollTop = list.scrollHeight;
}

setInterval(render, 500);
render();
</script>
</body>
</html>
